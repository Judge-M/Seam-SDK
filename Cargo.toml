[package]
name = "seam-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Bounded task-scoped worker runtime with replaceable reasoner and external ports"

[workspace]
resolver = "3"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "time"] }
